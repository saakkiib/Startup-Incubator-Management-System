<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IncubatorX</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Theme Management Script -->
    <script src="js/theme.js"></script>
</head>
<body id="body">
    <!-- Dashboard Navigation -->
    <header class="navbar">
        <h2 onclick="window.location.href='index.html'" style="cursor:pointer">IncubatorX</h2>
        <div class="right">
            <button id="theme-toggle" onclick="toggleTheme()" style="background:transparent; border:none; font-size:24px; cursor:pointer;">☀️</button>
            
            <div class="profile-container">
                <div class="profile" onclick="toggleDropdown()" style="cursor:pointer;display:flex;align-items:center;gap:10px;">
                    <span id="nav-user-name" style="font-weight:700"></span>
                    <div style="width:35px; height:35px; border-radius:50%; background:var(--primary); display:flex; align-items:center; justify-content:center; color:white; font-weight:800;" id="nav-avatar">UX</div>
                </div>
                <div class="dropdown" id="dropdown">
                    <p onclick="window.location.href='profile.html'">👤 Profile</p>
                    <p onclick="handleLogout()">🚪 Logout</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dashboard Layout -->
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass">
            <h3 id="role-title">Loading...</h3>
            <ul id="sidebar-nav" style="margin-top: 20px;">
                <!-- Nav items will be injected here via dashboard.js -->
            </ul>
        </aside>

        <!-- Dynamic Content Area -->
        <main class="main-content">
            <div id="content-area" class="glass content-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h2 id="view-title">Overview</h2>
                    <div id="header-actions"></div>
                </div>
                <div id="dynamic-content">
                    <!-- Content will be injected here via dashboard.js -->
                    <p class="text-muted">Loading your workspace...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Dashboard Logic Script -->
    <script src="js/dashboard.js"></script>
</body>
</html>
