<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications – Investor | IncubatorX</title>
    <meta name="description" content="Investor notifications for investments, startup updates, and portfolio alerts.">
    <link rel="stylesheet" href="css/investor.css">
</head>
<body>

<!-- Navbar -->
<nav class="inv-navbar">
    <a class="brand" href="dashboard-investor.html">IncubatorX</a>
    <div class="nav-right">
        <div class="user-info">
            <span id="nav-user-name">Investor</span>
            <div class="avatar" id="nav-avatar">IV</div>
        </div>
        <button id="theme-toggle" onclick="toggleTheme()">☀️</button>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="inv-layout">
    <!-- Sidebar -->
    <aside class="inv-sidebar">
        <h3>Investor Panel</h3>
        <ul>
            <li onclick="location.href='dashboard-investor.html'">📊 Dashboard Overview</li>
            <li onclick="location.href='browse-startups-investor.html'">🔍 Browse Startups</li>
            <li onclick="location.href='investor-startup-details.html'">📋 Startup Details</li>
            <li onclick="location.href='investor-funding.html'">💰 Funding Page</li>
            <li onclick="location.href='investor-history.html'">📜 Investment History</li>
            <li class="active" onclick="location.href='investor-notifications.html'">🔔 Notifications</li>
            <li onclick="location.href='investor-profile.html'">👤 Profile</li>
        </ul>
    </aside>

    <!-- Main -->
    <main class="inv-main">
        <div class="inv-card">
            <div class="page-header">
                <h1>🔔 Notifications</h1>
                <button class="btn btn-primary" onclick="markAllAsRead()">Mark All as Read</button>
            </div>
            <div id="notifications-list">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="margin-top:14px;">Loading notifications…</p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- View Modal -->
<div id="notification-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modal-title" style="font-size:1.2rem; font-weight:700;"></h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modal-body" style="line-height:1.7;"></div>
        <div class="modal-footer">
            <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<div id="toast-container"></div>
<script src="js/investor-notifications.js"></script>
</body>
</html>
