<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - IncubatorX</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/auth.css">
    
    <!-- Theme Management Script -->
    <script src="js/theme.js"></script>
</head>
<body id="body">

    <div class="auth-container">
        <!-- Theme Toggle Button -->
        <button id="theme-toggle" onclick="toggleTheme()" style="position:fixed; top:20px; right:20px; background:transparent; border:none; font-size:24px; cursor:pointer; z-index:1001;">☀️</button>
        
        <div class="auth-card glass">
            <!-- Authentication Tabs -->
            <div class="auth-tabs">
                <button id="tab-login" class="active" onclick="switchTab('login')">Login</button>
                <button id="tab-register" onclick="switchTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <h2>Welcome Back</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn auth-btn">Login</button>
            </form>

            <!-- Registration Form -->
            <form id="form-register" class="hidden" onsubmit="handleRegister(event)">
                <h2>Join IncubatorX</h2>
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <select id="reg-role" required>
                    <option value="" disabled selected>Select Role</option>
                    <option value="STUDENT">Student Entrepreneur</option>
                    <option value="INVESTOR">Venture Investor</option>
                    <option value="MENTOR">Industry Mentor</option>
                </select>
                <button type="submit" class="btn auth-btn">Register</button>
            </form>
            
            <!-- Error Message Display -->
            <p id="auth-error" class="error-msg"></p>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <!-- Authentication Logic Script -->
    <script src="js/auth.js"></script>
</body>
</html>
