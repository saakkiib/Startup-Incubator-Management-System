<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | IncubatorX</title>
    <link rel="stylesheet" href="index.css">
    <script src="theme.js"></script>
    <style>
        body { background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
        .profile-container {
            max-width: 1000px;
            margin: 100px auto;
            width: 100%;
            padding: 0 40px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 50px;
            animation: fadeIn 0.8s ease;
        }
        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 20px 40px rgba(20, 184, 166, 0.2);
        }
        .profile-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .form-group { margin-bottom: 25px; }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            background: var(--glass-card);
            border: 1px solid var(--border);
            color: var(--text);
            outline: none;
            font-weight: 600;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <header class="navbar">
        <h2 onclick="window.location.href='index.html'">IncubatorX</h2>
        <div class="nav-links">
            <button onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
            <button onclick="toggleTheme()" id="theme-toggle">☀️</button>
        </div>
    </header>

    <main class="profile-container">
        <div class="profile-header">
            <div class="profile-pic" id="profile-initials">JS</div>
            <div>
                <h1 id="user-display-name" style="font-size: 2.5rem; margin-bottom: 5px;">John Doe</h1>
                <p id="user-role-badge" style="color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 2px;">Startup Founder</p>
            </div>
        </div>

        <div class="glass" style="padding: 50px; border-radius: 40px;">
            <h3 style="margin-bottom: 30px; font-size: 1.5rem;">Global Identity Settings</h3>
            <form id="profile-form">
                <div class="profile-form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="full-name" placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email (Verified)</label>
                        <input type="email" id="email" disabled>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" id="phone" placeholder="+1 (555) 000-0000">
                    </div>
                    <div class="form-group">
                        <label>User Role</label>
                        <input type="text" id="role-display" disabled>
                    </div>
                </div>
                
                <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn arrow-btn" style="padding: 15px 40px;">
                        Save Identity <span class="arrows"><span>&gt;</span><span>&gt;</span><span>&gt;</span></span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) { window.location.href = 'auth.html'; return; }

            document.getElementById('user-display-name').innerText = user.fullName || user.username;
            document.getElementById('user-role-badge').innerText = user.role;
            document.getElementById('full-name').value = user.fullName || '';
            document.getElementById('email').value = user.email;
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('role-display').value = user.role;
            document.getElementById('profile-initials').innerText = (user.fullName || user.username).substring(0, 2).toUpperCase();

            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const updatedUser = {
                    fullName: document.getElementById('full-name').value,
                    phone: document.getElementById('phone').value
                };

                try {
                    const res = await fetch(`http://localhost:8080/api/users/${user.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedUser)
                    });
                    if (res.ok) {
                        const savedUser = await res.json();
                        localStorage.setItem('user', JSON.stringify(savedUser));
                        alert('Identity updated successfully!');
                        window.location.reload();
                    }
                } catch (error) {
                    console.error('Update error:', error);
                }
            });
        });
    </script>
</body>
</html>
